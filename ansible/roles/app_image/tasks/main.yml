---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"

- name: Copy project files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../"
    dest: "{{ app_dir }}/"
    mode: preserve

- name: Build application image
  community.docker.docker_image:
    name: "{{ app_image }}"
    tag: latest
    source: build
    build:
      path: "{{ app_dir }}"
      dockerfile: Dockerfile
